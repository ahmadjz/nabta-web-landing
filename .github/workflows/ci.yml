name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (astro)
        run: npm run build

      - name: Smoke test (emitted dist)
        run: npm run test

      # Preflight: the headless leg below depends on the ubuntu-latest runner image
      # shipping Google Chrome at /usr/bin/google-chrome. If a future image relocates
      # or drops it, fail HERE with a clear infra-vs-code message instead of a cryptic
      # puppeteer "Chrome not found" downstream (update the path or add a setup step).
      - name: Verify Chrome for the headless leg
        run: |
          test -x /usr/bin/google-chrome || {
            echo "::error::Google Chrome not found at /usr/bin/google-chrome — the ubuntu-latest runner image changed. Update PUPPETEER_EXECUTABLE_PATH or add a Chrome-install step (e.g. browser-actions/setup-chrome)."
            exit 1
          }
          /usr/bin/google-chrome --version

      # Preview-SERVED checks — astro preview honours `base` (astro dev does not).
      # The headless-browser leg (reduce-motion / toggle / LCP / coarse-pointer runtime
      # proofs) is REQUIRED here, never a silent skip (LPV2-08): REQUIRE_HEADLESS=1 turns
      # a missing Chrome into a HARD failure, and PUPPETEER_EXECUTABLE_PATH points at the
      # runner image's pre-installed Google Chrome so the leg actually runs.
      - name: Preview-served checks (headless leg required — fails, never skips)
        run: npm run test:preview
        env:
          REQUIRE_HEADLESS: "1"
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

      # Internal link-check + no-third-party NETWORK assertion (preview-served).
      - name: Link-check + no-third-party
        run: npm run test:links

  # Lighthouse runs the audited build through `astro preview` (honours `base`) and
  # GATES SEO + accessibility + best-practices at firm thresholds (deterministic for
  # Astro static HTML). PERFORMANCE is collected + reported but NOT gated — a
  # throttled perf score is flaky and would create a stuck loop (see lighthouserc.json).
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (astro)
        run: npm run build

      - name: Start preview server (honours base)
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4321/nabta-web-landing/ >/dev/null; then
              echo "preview up"; exit 0
            fi
            sleep 1
          done
          echo "preview server never came up" >&2; exit 1

      - name: Lighthouse (SEO/a11y/best-practices gated; performance report-only)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:4321/nabta-web-landing/
            http://127.0.0.1:4321/nabta-web-landing/en/
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
